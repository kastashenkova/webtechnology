<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="lab4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>

        <div class="add-task-section">
            <input type="text" placeholder="Додати нове завдання" class="add-task-input">
            <a href="#taskModal" class="add-task-button button button-primary">Додати</a>
        </div>

        <div class="controls-section">
            <div class="sort-by">
                <span>Сортувати за:</span>
                <select id="sort-filter">
                    <option value="date">датою</option>
                    <option value="name">назвою</option>
                    <option value="priority">важливістю</option>
                </select>
            </div>
            <div class="filter-by">
                <span>Фільтр:</span>
                <select id="task-filter">
                    <option value="all">Усі</option>
                    <option value="filterDate">Дата</option>
                    <option value="completed">Виконані</option>
                    <option value="pending">Невиконані</option>
                    <option value="high">Високий пріоритет</option>
                    <option value="medium">Середній пріоритет</option>
                    <option value="low">Низький пріоритет</option>
                </select>
            </div>
            <a href="#dateFilterModal" class="button button-primary filter-by-date-button">Фільтр за датою</a>
        </div>

        <div class="task-list">
            <div class="task-item">
                <input type="checkbox" class="task-checkbox">
                <div class="task-details">
                    <input type="text" value="Завершити проєкт" class="task-text-input" readonly>
                    <span class="task-date">1 травня 2024</span>
                    <div class="task-meta">
                        <span class="task-priority medium">Середній</span>
                    </div>
                </div>
                <div class="task-actions">
                    <span class="delete-icon"><i class="fas fa-trash-alt"></i></span>
                </div>
            </div>
            <div class="task-item">
                <input type="checkbox" class="task-checkbox">
                <div class="task-details">
                    <input type="text" value="Прочитати книгу" class="task-text-input" readonly>
                    <span class="task-date">25 квітня 2024</span>
                    <div class="task-meta">
                        <span class="task-priority low">Низький</span>
                    </div>
                </div>
                <div class="task-actions">
                    <span class="delete-icon"><i class="fas fa-trash-alt"></i></span>
                </div>
            </div>
            <div class="task-item">
                <input type="checkbox" class="task-checkbox">
                <div class="task-details">
                    <input type="text" value="Піти в спортзал" class="task-text-input" readonly>
                    <span class="task-date">23 квітня 2024</span>
                    <div class="task-meta">
                        <span class="task-priority high">Високий</span>
                    </div>
                </div>
                <div class="task-actions">
                    <span class="delete-icon"><i class="fas fa-trash-alt"></i></span>
                </div>
            </div>
            <div class="task-item">
                <input type="checkbox" class="task-checkbox">
                <div class="task-details">
                    <input type="text" value="Записатися до лікаря" class="task-text-input" readonly>
                    <span class="task-date">20 квітня 2024</span>
                    <div class="task-meta">
                        <span class="task-priority medium">Середній</span>
                    </div>
                </div>
                <div class="task-actions">
                    <span class="delete-icon"><i class="fas fa-trash-alt"></i></span>
                </div>
            </div>
        </div>

        <div id="taskModal" class="modal">
            <div class="modal-content">
                <a href="#" class="close-button">&times;</a>
                <h2 id="modalTitle">Додати завдання</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Назва завдання</label>
                        <input type="text" id="taskTitle" placeholder="Наприклад: Завдання 1" name="taskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Дата виконання</label>
                        <input type="date" id="taskDueDate" name="taskDueDate" required>
                    </div>
                    <div class="form-group">
                        <label>Пріоритет</label>
                        <div class="priority-options">
                            <input type="radio" id="priorityHigh" name="taskPriority" value="high">
                            <label for="priorityHigh">Високий</label>
                            <input type="radio" id="priorityMedium" name="taskPriority" value="medium" checked>
                            <label for="priorityMedium">Середній</label>
                            <input type="radio" id="priorityLow" name="taskPriority" value="low">
                            <label for="priorityLow">Низький</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="button button-primary1" id="submitTaskButton">Додати завдання</button>
                        <a href="#" class="button button-cancel">Скасувати</a>
                    </div>
                </form>
            </div>
        </div>

        <div id="dateFilterModal" class="modal">
            <div class="modal-content">
                <a href="#" class="close-button">&times;</a>
                <h2>Фільтр за датою</h2>
                <div class="form-group">
                    <label for="dateFilterCategorySelect">Оберіть категорію:</label>
                    <select id="dateFilterCategorySelect">
                        <option value="current">Поточні</option>
                        <option value="upcoming">Майбутні</option>
                        <option value="past">Минулі</option>
                    </select>
                </div>
                <div class="form-group" id="specificDateInputGroup">
                    <label for="specificDateFilter">Оберіть дату:</label>
                    <input type="date" id="specificDateFilter" name="specificDateFilter">
                </div>
                <div class="form-actions-date-filter">
                    <button type="button" class="button button-primary1">Застосувати</button>
                </div>
            </div>
        </div>

    </body>
</html>
